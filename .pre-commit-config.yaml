# Local checks on staged files, a fast subset of CI (.github/workflows/ci.yml).
# Install once per clone:  pip install pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files
# Pins are release tags; `pre-commit autoupdate` bumps them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown (.editorconfig).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=500]

  # Keep this rev equal to the ruff that backend[dev] installs, so the hook and
  # CI agree. Ruff reads backend/pyproject.toml for files under backend/.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
        types_or: [python, pyi]

  # Keep this rev equal to the prettier in frontend/package-lock.json.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# The support matrix: every supported Django on every Python it supports.
# Each environment installs the built package (not the source tree) into a
# fresh virtualenv and runs the tests against tests/testproject, a throwaway
# Django project, so a packaging mistake fails here too.
[tox]
env_list =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61}
skip_missing_interpreters = false

[testenv]
package = wheel
extras = test
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    python -c "import django, sys; print('Django', django.get_version(), 'on Python', sys.version.split()[0])"
    pytest -p no:cacheprovider {posargs}

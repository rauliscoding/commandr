[project]
name = "commandr"
version = "0.1.0"
description = "One place for an indie product's health, audience and money."
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2.7,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "django-allauth[mfa,socialaccount]>=65.11,<66",
    "django-environ>=0.12,<0.13",
    "psycopg[binary]>=3.2.10,<3.3",
    "argon2-cffi>=25.1",
    "cryptography>=45",
    "httpx>=0.28,<0.29",
    "celery[redis]>=5.5,<5.6",
    "django-celery-beat>=2.8,<2.9",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "jsonschema>=4.23,<5",  # ingest payloads validated against the contract's schemas
    "redis>=5,<6",          # the ingest stream (also pulled in by celery[redis])
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "factory-boy>=3.3",
    "ruff>=0.13",
    "mypy>=1.18",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
    "types-jsonschema",
    "fakeredis>=2.30",       # ingest stream tests without a Redis server
    "time-machine>=2.16",    # frozen clocks for heartbeats, cooldowns, digests
    "pyyaml>=6",             # contract test reads the OpenAPI file
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commandr*", "config*"]

# --- Ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "S",                # bandit (security)
    "DJ",               # django
    "SIM",              # simplify
    "PT",               # pytest style
    "RUF",
]
ignore = ["RUF012"]     # mutable class attrs are idiomatic in Django/DRF Meta

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # asserts and fake secrets are fine in tests

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
# Untyped third-party packages.
module = ["allauth.*", "django_celery_beat.*", "environ.*", "factory.*", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: hits real third-party sandboxes; never run in CI"]
filterwarnings = [
    # WhiteNoise warns that collectstatic has not run; irrelevant to tests.
    "ignore:No directory at:UserWarning",
]

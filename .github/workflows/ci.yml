# Every check here must pass before a pull request merges into main
# (docs/practices/git-process.md § Automated checks). Run the same commands
# locally first: docs/development.md § Checking your change.
#
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to point
# at different code, a SHA cannot. Dependabot keeps the pins current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

# A new push to the same pull request (or to main) supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commandr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      # The tests connect as the owner role: a superuser bypasses row-level
      # security and tests/conftest.py refuses to run as one.
      DATABASE_URL: postgres://commandr_owner:commandr_owner@127.0.0.1:5432/commandr
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same script the dev and prod Postgres run on first start, so CI's
      # roles cannot drift from the real ones. The superuser is used only here.
      - name: Create the Commandr database roles
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: commandr
          COMMANDR_OWNER_PASSWORD: commandr_owner
          COMMANDR_APP_PASSWORD: commandr_app
        run: sh ../deploy/compose/postgres/init/01-roles.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: .
        run: pip install -e "./backend[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy commandr config

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk:
    name: SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python/commandr-django
    steps:
      # The whole repository, not just the SDK: the contract tests read
      # docs/architecture/openapi/ingest-v1.yaml and sign polls with
      # backend/commandr/monitoring/signing.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdks/python/commandr-django/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest

      # sdk-matrix lists the tox environments by hand; fail here if tox.ini
      # gains or loses one, so a supported version cannot drop out of CI.
      - name: sdk-matrix covers every tox environment
        run: |
          python - <<'EOF'
          import subprocess
          import yaml

          with open("../../../.github/workflows/ci.yml") as f:
              workflow = yaml.safe_load(f)
          matrix = workflow["jobs"]["sdk-matrix"]["strategy"]["matrix"]["include"]
          in_ci = {entry["toxenv"] for entry in matrix}
          tox_l = subprocess.run(["tox", "-l"], check=True, capture_output=True, text=True)
          in_tox = set(tox_l.stdout.split())
          if in_ci != in_tox:
              raise SystemExit(f"tox.ini only: {sorted(in_tox - in_ci)}; ci.yml only: {sorted(in_ci - in_tox)}")
          EOF

  sdk-matrix:
    # One job per tox environment (tox.ini env_list): every supported Django on
    # every Python it supports. Each installs the built wheel, so a packaging
    # mistake fails here too.
    name: SDK ${{ matrix.toxenv }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", toxenv: py310-django52 }
          - { python: "3.11", toxenv: py311-django52 }
          - { python: "3.12", toxenv: py312-django52 }
          - { python: "3.13", toxenv: py313-django52 }
          - { python: "3.14", toxenv: py314-django52 }
          - { python: "3.12", toxenv: py312-django60 }
          - { python: "3.13", toxenv: py313-django60 }
          - { python: "3.14", toxenv: py314-django60 }
          - { python: "3.12", toxenv: py312-django61 }
          - { python: "3.13", toxenv: py313-django61 }
          - { python: "3.14", toxenv: py314-django61 }
    defaults:
      run:
        working-directory: sdks/python/commandr-django
    env:
      TOX_VERSION: 4.67.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python/commandr-django/pyproject.toml

      - name: Install tox
        run: pip install "tox==${TOX_VERSION}"

      - name: tox -e ${{ matrix.toxenv }}
        run: tox -e "${{ matrix.toxenv }}"

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt on the release page. Bump both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      PIP_AUDIT_VERSION: 2.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
          persist-credentials: false

      # The release binary rather than gitleaks-action, whose scan scope
      # changes with the event; checksum-verified so a swapped asset fails.
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Audit exactly what the backend job installs (runtime and dev), resolved
      # in its own venv so pip-audit's own dependencies are not in the report.
      - name: pip-audit
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/pip" install -e "./backend[dev]"
          "$RUNNER_TEMP/app/bin/pip" freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev

  dco:
    name: DCO sign-off
    # Dependabot cannot certify the DCO; its PRs are reviewed and signed off
    # by the maintainer in the squash commit instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the PR's own commits, back to where it left main
          persist-credentials: false

      # Every commit must carry "Signed-off-by: <author name> <author email>"
      # (the DCO, ADR 0007). Merge commits are skipped: they add no new code.
      - name: Check every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            expected="Signed-off-by: $(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$sha" | grep -qxF "$expected"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") lacks \"$expected\""
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s' (amend: 'git commit --amend -s --no-edit')."
            exit 1
          fi

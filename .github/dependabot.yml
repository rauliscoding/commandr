# Weekly dependency updates, one grouped pull request per ecosystem so the
# queue stays reviewable. Groups apply to version updates only: security
# updates (when enabled in the repository settings) still arrive one by one.
# Dependabot cannot sign off its commits, so the CI DCO job skips its PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        patterns: ["*"]

  # Bumps the SHA pins in .github/workflows and keeps the version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
